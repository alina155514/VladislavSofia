<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Владислав и София</title>
    <link rel="stylesheet" href="stile.css">
</head>
<body>

    <!-- 1. Hero -->
    <div class="screen hero">
        <img src="img/фото1.svg" alt="" class="hero-photo">
        <img src="img/имя на главной.svg" alt="" class="hero-name">
    </div>

    <!-- 2. Дорогая семья -->
    <div class="screen2">
        <div class="content-narrow">
            <img src="img/Дорогая семья.svg" alt="" class="img-block h1">
            <img src="img/текст.svg" alt="" class="img-block text">
            <img src="img/дата-1.svg" alt="" class="img-block imgData">
            <img src="img/руки.svg" alt="" class="img-block img-hands">
        </div>
    </div>

    <!-- 3. Наш день -->
    <div class="screen2">
        <img src="img/Наш день.svg" alt="" class="img-block  h2">

        <div class="time-item">
            <img src="img\камера.svg" alt="" class="tl-icon tl-icon--left">
            <img src="img/Component 8.svg" alt="" class="imgTime">
        </div>

        <div class="time-item">
            <img src="img/Component 9.svg" alt="" class="imgTime">
            <img src="img\кольца.svg" alt="" class="tl-icon tl-icon--right">
        </div>

        <div class="time-item">
            <img src="img\торт.svg" alt="" class="tl-icon tl-icon--left">
            <img src="img/Component 10.svg" alt="" class="imgTime">
        </div>

        <div class="time-item">
            <img src="img/Component 11.svg" alt="" class="imgTime">
            <img src="img\свечи.svg" alt="" class="tl-icon tl-icon--right">
        </div>
    </div>

    <!-- 4. Локации -->
    <div class="screen2">
        <img src="img/Локации.svg" alt="" class="img-block h2">
        <div class="loc">
            <img src="img/загс.svg"  alt="" class="imgloc">
            <img src="img/шале.svg"  alt="" class="imgloc">
        </div>
        <img src="img/Мы хотим, чтобы дорога до нас была для вас удобной и спокойной Если вам нужна помощь с маршрутом, парковкой или такси, пожалуйста, напиши.svg"
             alt="" class="img-block text loc-text">
        <img src="img/фото шале.png" alt="" class=" img-chalet">
    </div>

    <!-- 5. Дресс-код + Пожелания -->
    <div class="screen2">
        <div class="content-narrow">
            <img src="img/Дресс-код.svg" alt="" class="img-block h2">
            <img src="img/дресс.svg"     alt="" class="img-block text1">
            <img src="img/Пожелания.svg" alt="" class="img-block h3">
            <img src="img/пожелан.svg"   alt="" class="img-block text">
        </div>
    </div>

    <!-- 6. Финал -->
    <div class="screen2">
        <div class="content-narrow">
            <img src="img/дата-1.svg" alt="" class="img-block imgData">
            <img src="img/Дорогие наши, мы очень ждём этот день! Ждём не только церемонию и праздник, но и возможность увидеть вас, обнять, поговорить и разделить.svg"
                 alt="" class="img-block text1">
            <img src="img/фото конец.svg" alt="" class="img-block img-end">
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            const elementsToAnimate = document.querySelectorAll('.screen2 > *, .screen2 .time-item');

            elementsToAnimate.forEach(el => el.classList.add('reveal'));

            const observerOptions = {
                root: null,       
                rootMargin: "0px",
                threshold: 0.15   
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                
                        entry.target.classList.add('active');

                    }
                });
            }, observerOptions);

            elementsToAnimate.forEach(el => observer.observe(el));
        });
    </script>

</body>
</html>
